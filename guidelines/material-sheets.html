<!-- @dsCard group="Material" viewport="760x340" name="One ream" subtitle="Same stock, different lay" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      margin: 0;
      height: 340px;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
    }

    /* The heading sat at --text-display-size (62px) and alone ate up
     * a third of the card. A card title is not a page heading. */
    .header {
      padding: var(--space-3) var(--space-4) 0;
      font-size: var(--text-subhead-size);
      font-weight: var(--text-subhead-weight);
      letter-spacing: var(--text-subhead-tracking);
      line-height: var(--text-subhead-leading);
    }

    .explanation {
      padding: 0 var(--space-4) var(--space-2);
      font-size: var(--text-caption-size);
      color: var(--ink-secondary);
    }

    /* The two bands stood side by side: four sheets in 350px are 85px
     * wide each, and at that size the fibre lay can no longer be told
     * apart — exactly the point of the card. Stacked, each sheet gets 165px. */
    .container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    section {
      flex: 0 0 auto;
      min-width: 0;
      padding: var(--space-2) var(--space-4);
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    /* HEIGHT leads, width follows. With flex:1 on the rows and aspect-ratio on
     * the sheets, width determined height — and the sum blew out the
     * section, so the caption sat on top of the dark band. Now the height is
     * fixed, and sheet and magnifier get the same width, because both
     * carry the same aspect ratio, 150:58 and 150:30 respectively. */
    .sheets-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-1);
      flex: 0 0 auto;
    }

    svg.sheet { height: 56px; aspect-ratio: 150 / 58; }
    svg.magnifier { height: 29px; aspect-ratio: 150 / 30; }

    .caption {
      padding: 0 var(--space-4) var(--space-3);
      font-size: var(--text-caption-size);
      color: var(--ink-tertiary);
    }
  </style>
</head>
