<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body {
  margin: 0;
  padding: var(--space-6);
  height: 320px;
  background-color: var(--paper);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.container {
  max-width: var(--measure);
}

.eyebrow {
  font-size: var(--text-eyebrow-size);
  font-weight: var(--text-eyebrow-weight);
  letter-spacing: var(--text-eyebrow-tracking);
  line-height: var(--text-eyebrow-leading);
  color: var(--ink-secondary);
  margin-bottom: var(--space-3);
  text-transform: uppercase;
}

.body-text {
  font-size: var(--text-body-size);
  font-weight: var(--text-body-weight);
  letter-spacing: var(--text-body-tracking);
  line-height: var(--text-body-leading);
  color: var(--ink);
  margin-bottom: var(--space-4);
  margin-top: 0;
}

.caption {
  font-size: var(--text-caption-size);
  font-weight: var(--text-caption-weight);
  letter-spacing: var(--text-caption-tracking);
  line-height: var(--text-caption-leading);
  color: var(--ink-secondary);
  margin-top: 0;
  margin-bottom: 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow">Typography</div>
  <p class="body-text">This system reads as a single family. The kinship between the cuts comes from size and weight, not from colour. The margin structures the page and guides the eye: it is not waste, but form.</p>
  <p class="caption">Maximum measure for optimal legibility, bound into the rhythmic spacing system.</p>
</div>
</body>
</html>
