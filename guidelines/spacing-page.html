<!-- @dsCard group="Spacing" viewport="760x280" name="Page margin" subtitle="Proportional, not fixed" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin: 0; height: 280px; display: flex; gap: var(--space-4); padding: var(--space-4); align-items: center;">

<div style="flex: 0.6;">
  <div style="background: var(--paper-alt); padding: 7%; border-radius: var(--radius-card);">
    <div style="font-family: var(--font-sans); color: var(--ink);">First line of text</div>
    <div style="font-family: var(--font-sans); color: var(--ink); margin-top: var(--space-2);">Second line of text</div>
  </div>
  <div style="margin-top: var(--space-1); font-family: var(--font-sans); font-size: var(--text-caption-size); color: var(--ink-secondary);">--page-inset: 7vw</div>
</div>

<div style="flex: 0.4;">
  <div style="background: var(--paper-alt); padding: 7%; border-radius: var(--radius-card);">
    <div style="font-family: var(--font-sans); color: var(--ink);">First line of text</div>
    <div style="font-family: var(--font-sans); color: var(--ink); margin-top: var(--space-2);">Second line of text</div>
  </div>
  <div style="margin-top: var(--space-1); font-family: var(--font-sans); font-size: var(--text-caption-size); color: var(--ink-secondary);">No more fixed 88px margin — the sheet is the unit, not the window</div>
</div>

</body>
</html>
