<title>Mark — a Gaussian over its axis, which is also an A</title>
<desc>sigma 9, axis y=46, apex y=10, tails settling at y=72. The viewBox is CROPPED to the ink extent and its vertical centre is the axis, so the mark is centred in whatever box a consumer gives it and the bar lands on any rule it is placed against. An earlier cut kept a square 120x120 box while sigma and the axis moved through three sharpening rounds, leaving the drawing at 52 per cent of its own box and 19 units above centre. One line does both jobs: the x axis a peak is measured against, and the A's bar. 4px literal via non-scaling-stroke. GENERATED.</desc>
