<title>Anselm W. Hahn</title>
<desc>The page's last rule and the mark as ONE unbroken stroke: flat along the axis, rising into a Gaussian near the right end where a signature falls, flat again. sigma 24, sharpened with the mark (was 34, and 52 before that). The axis stays low at y=96 of 120 because here it IS the page's last rule; raising it would leave the rule floating above the footer's baseline. Apex y=12, not clipped. GENERATED.</desc>
