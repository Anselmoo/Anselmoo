<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="">
<title>bashplot</title>
<desc>Index thumbnail. A fitted peak on its axis; the peak height encodes this project's usage as a share of the largest value IN ITS OWN UNIT (frac 0.016). Drawn as a 1.4px STROKE, not a fill. The previous cut applied the layer-drop rule literally and produced a single filled bar covering 30 to 100 per cent of the tile, in a tone identical to --ink, which made the decoration the brightest thing in every index row — tone capped, area not. The axis is kept so the peak is read against something: one layer of a bar figure is a rectangle. GENERATED.</desc>
