<!doctype html>
<html><head><meta charset="utf-8"><title>Paper check — seed invariance</title>
<style>
 body{margin:0;padding:24px;font:13px/1.5 -apple-system,BlinkMacSystemFont,Inter,sans-serif;background:#e9e7e1;color:#232320}
 .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
 .cell svg{display:block;border-radius:3px}
 .lbl{font-size:12px;color:#6e6e68;margin-top:5px}
 h2{font-size:12px;font-weight:600;margin:0 0 10px;letter-spacing:.05em;text-transform:uppercase;color:#6e6e68}
 pre{font:12px/1.6 ui-monospace,monospace;background:#fbfaf7;padding:14px;border-radius:3px;overflow:auto}
</style></head><body>

<h2>One ream, different sheets</h2>
<div class="row" id="sheets"></div>
<h2>Measurement per sheet</h2>
<pre id="out">measuring…</pre>

<script type="module">
// Cache-busting on purpose: an instrument that measures a stale version of the
// definition reports a verdict on code that no longer exists in that form.
// That is exactly what happened here once — the page reported FAILED for a
// sheet whose offset had already been set. The timestamp forces fresh goods.
const { paperSheet, sheetSeed } = await import(`./paper.mjs?t=${Date.now()}`);

const NAMES = ["SpectraFit","TanabeSugano","mcp-server-analyzer","bashplot","repo-release-tools","werkstoff"];
const W = 220, H = 130, GROUND = "#fbfaf7";

const host = document.getElementById("sheets");
for (const n of NAMES) {
  const d = document.createElement("div");
  d.className = "cell";
  d.innerHTML = paperSheet(n, { width: W, height: H, ground: GROUND })
    + `<div class="lbl">${n} · seed ${sheetSeed(n)}</div>`;
  host.appendChild(d);
}

const lin = v => (v <= 0.04045 ? v/12.92 : ((v+0.055)/1.055)**2.4);
const relLum = (r,g,b) => 0.2126*lin(r/255)+0.7152*lin(g/255)+0.0722*lin(b/255);

async function measure(markup){
  const img = new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error("load"));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(markup);});
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data;
  const L=new Float64Array(W*H); let sum=0;
  for(let i=0,p=0;i<d.length;i+=4,p++){L[p]=relLum(d[i],d[i+1],d[i+2]);sum+=L[p];}
  const n=W*H, mean=sum/n;
  let eh=0,ev=0,ch=0,cv=0;
  for(let y=0;y<H;y++)for(let x=0;x<W-1;x++){eh+=(L[y*W+x+1]-L[y*W+x])**2;ch++;}
  for(let y=0;y<H-1;y++)for(let x=0;x<W;x++){ev+=(L[(y+1)*W+x]-L[y*W+x])**2;cv++;}
  eh/=ch; ev/=cv;
  let vs=0; for(let p=0;p<n;p++) vs+=(L[p]-mean)**2;
  return {mean, sd:Math.sqrt(vs/n), aniso:Math.max(eh,ev)/Math.max(Math.min(eh,ev),1e-12)};
}

(async()=>{
  const flat = await measure(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${GROUND}"/></svg>`);
  const o=[`Ground tone ${GROUND} — reference luminance ${flat.mean.toFixed(5)}`,""];
  o.push("Sheet                  seed   mean L       R6 dev.   spread    anisotropy");
  o.push("-".repeat(76));
  const devs=[], anis=[];
  for(const nme of NAMES){
    const m = await measure(paperSheet(nme,{width:W,height:H,ground:GROUND}));
    const dev=(m.mean-flat.mean)/flat.mean*100;
    devs.push(Math.abs(dev)); anis.push(m.aniso);
    o.push(nme.padEnd(22)+String(sheetSeed(nme)).padStart(5)
      +m.mean.toFixed(5).padStart(13)
      +((dev>=0?"+":"")+dev.toFixed(3)+"%").padStart(10)
      +m.sd.toFixed(4).padStart(11)+ (m.aniso.toFixed(4)+"x").padStart(13));
  }
  o.push("");
  o.push(`R6  largest deviation across all sheets: ${Math.max(...devs).toFixed(4)} %  (limit 1.0000 %)  -> ${Math.max(...devs)<=1?"passed":"FAILED"}`);
  o.push(`R3  largest anisotropy across all sheets: ${Math.max(...anis).toFixed(4)}x  (limit 1.1500x) -> ${Math.max(...anis)<=1.15?"passed":"FAILED"}`);
  o.push("");
  o.push("The seed changes the fibre lay, not the measured values. That is the point.");
  document.getElementById("out").textContent=o.join("\n");
})().catch(e=>{document.getElementById("out").textContent="Error: "+e.message;});
</script>
</body></html>
